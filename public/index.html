<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ---------------------------------------------------------------------------
// ค่าคงที่ / ข้อมูลอ้างอิงฝั่ง client (ต้องตรงกับ server/gameData.js)
// ---------------------------------------------------------------------------
const CATEGORY_LABELS = {
  Strings: { th: 'เครื่องสาย', emoji: '🎻', color: 'from-rose-500 to-orange-400' },
  Brass: { th: 'เครื่องทองเหลือง', emoji: '🎺', color: 'from-amber-500 to-yellow-400' },
  Woodwind: { th: 'เครื่องลมไม้', emoji: '🪈', color: 'from-emerald-500 to-teal-400' },
  Percussion: { th: 'เครื่องกระทบ', emoji: '🥁', color: 'from-fuchsia-500 to-purple-400' },
  Keyboard: { th: 'คีย์บอร์ด', emoji: '🎹', color: 'from-sky-500 to-cyan-400' },
};
const ITEM_META = {
  coda: { name: 'Coda', th: 'ระเบิดขยะ', price: 20, emoji: '🗑️', ring: 'ring-amber-700' },
  glissando: { name: 'Glissando', th: 'พายุสลับการ์ด', price: 40, emoji: '🌀', ring: 'ring-slate-300' },
  fermata: { name: 'Fermata', th: 'หยุดเวลา', price: 80, emoji: '🧊', ring: 'ring-yellow-300' },
  forte: { name: 'Forte', th: 'สว่างวาบ', price: 30, emoji: '💡', ring: 'ring-lime-300' },
};

// เสียงประกอบแบบเบา ๆ ด้วย Web Audio (ไม่ต้องพึ่งไฟล์เสียงภายนอก)
function beep(freq = 440, dur = 0.12, type = 'sine', gain = 0.06) {
  try {
    const ctx = beep._ctx || (beep._ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = gain;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.stop(ctx.currentTime + dur);
  } catch (e) { /* audio not available */ }
}
const sfx = {
  swipe: () => beep(660, 0.08, 'triangle', 0.05),
  correct: () => { beep(523, 0.09, 'sine', 0.07); setTimeout(() => beep(784, 0.15, 'sine', 0.07), 90); },
  wrong: () => beep(160, 0.25, 'sawtooth', 0.07),
  coin: () => beep(988, 0.08, 'square', 0.04),
  sabotage: () => { beep(120, 0.3, 'sawtooth', 0.08); setTimeout(() => beep(90, 0.35, 'sawtooth', 0.08), 120); },
};

function useSocket() {
  const [socket] = useState(() => io({ autoConnect: true }));
  useEffect(() => () => socket.close(), [socket]);
  return socket;
}

// ---------------------------------------------------------------------------
// หน้าแรก: เลือกบทบาท ครู / นักเรียน
// ---------------------------------------------------------------------------
function Home({ onPickRole }) {
  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center">
      <div className="mb-8">
        <div className="text-6xl mb-2">🎸🥁🎺</div>
        <h1 className="display text-5xl font-extrabold tracking-tight text-amber-300">Band Rush</h1>
        <p className="text-stone-400 mt-1">ตั้งวงด่วน! — จัดหมวดเครื่องดนตรีให้ทันเวลา</p>
      </div>
      <div className="grid grid-cols-1 gap-4 w-full max-w-sm">
        <button onClick={() => onPickRole('teacher')}
          className="rounded-2xl bg-gradient-to-br from-orange-500 to-rose-600 px-6 py-5 font-bold text-lg shadow-lg shadow-rose-900/40 active:scale-95 transition">
          👩‍🏫 ครู — ตั้งห้องบนจอโปรเจคเตอร์
        </button>
        <button onClick={() => onPickRole('student')}
          className="rounded-2xl bg-gradient-to-br from-sky-500 to-indigo-600 px-6 py-5 font-bold text-lg shadow-lg shadow-indigo-900/40 active:scale-95 transition">
          🧑‍🎤 นักเรียน — เข้าร่วมด้วยรหัส PIN
        </button>
      </div>
      <p className="text-xs text-stone-500 mt-10 max-w-sm">เล่นได้ทั้งบนมือถือ (แนวนอน) สำหรับผู้เล่น และคอมพิวเตอร์/โปรเจคเตอร์สำหรับครู</p>
    </div>
  );
}

// ---------------------------------------------------------------------------
// ครูสร้างห้อง
// ---------------------------------------------------------------------------
function TeacherCreate({ socket, onRoomReady }) {
  const [mode, setMode] = useState('COMPETITIVE');
  const [busy, setBusy] = useState(false);
  const create = () => {
    setBusy(true);
    socket.emit('create_room', { type: mode }, (res) => {
      setBusy(false);
      if (res && res.pin) onRoomReady(res.pin);
    });
  };
  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center gap-6">
      <h2 className="display text-3xl font-bold text-amber-300">ตั้งห้องเรียนใหม่</h2>
      <div className="flex gap-3">
        <button onClick={() => setMode('COMPETITIVE')}
          className={`px-5 py-3 rounded-xl font-semibold border-2 ${mode==='COMPETITIVE' ? 'bg-rose-600 border-rose-400' : 'border-stone-600 text-stone-400'}`}>
          🔴 โหมดแข่งขัน (Competitive)
        </button>
        <button onClick={() => setMode('COOP')}
          className={`px-5 py-3 rounded-xl font-semibold border-2 ${mode==='COOP' ? 'bg-emerald-600 border-emerald-400' : 'border-stone-600 text-stone-400'}`}>
          🟢 ตั้งวงทั่วไป (Co-op)
        </button>
      </div>
      <button disabled={busy} onClick={create}
        className="rounded-2xl bg-amber-400 text-stone-900 px-8 py-4 font-extrabold text-lg shadow-lg active:scale-95 transition disabled:opacity-50">
        {busy ? 'กำลังสร้าง...' : 'สร้างห้อง ▶'}
      </button>
    </div>
  );
}

// ---------------------------------------------------------------------------
// จอครู / โปรเจคเตอร์
// ---------------------------------------------------------------------------
function TeacherDashboard({ socket, pin }) {
  const [state, setState] = useState({ status: 'LOBBY', timer_seconds: 0, teams: {} });
  const [flash, setFlash] = useState(null);

  useEffect(() => {
    // socket นี้ join ห้อง `pin` ไว้แล้วตอนเรียก create_room ฝั่งเซิร์ฟเวอร์
    // (ไม่เรียก join_room ซ้ำ เพราะจะกลายเป็นสร้าง "ทีมผี" ปนกับทีมนักเรียนจริง)
    const onDash = (d) => setState((s) => ({ ...s, status: d.status, timer_seconds: d.timer_seconds, teams: d.teams }));
    const onOver = (d) => setState((s) => ({ ...s, status: 'DONE', teams: d.teams }));
    socket.on('dashboard_update', onDash);
    socket.on('game_over', onOver);
    return () => { socket.off('dashboard_update', onDash); socket.off('game_over', onOver); };
  }, [socket, pin]);

  const teamIds = Object.keys(state.teams);
  const maxScore = Math.max(1, ...teamIds.map((t) => state.teams[t].score));
  const mm = Math.floor((state.timer_seconds || 0) / 60);
  const ss = String((state.timer_seconds || 0) % 60).padStart(2, '0');

  return (
    <div className="min-h-screen p-8 flex flex-col">
      <div className="flex items-center justify-between mb-8">
        <div>
          <div className="text-stone-400 text-sm">รหัสห้อง (PIN)</div>
          <div className="display text-5xl font-extrabold tracking-widest text-amber-300">{pin}</div>
        </div>
        <div className="text-center">
          <div className="text-stone-400 text-sm">เวลา</div>
          <div className="display text-6xl font-extrabold">{mm}:{ss}</div>
        </div>
        <div>
          {state.status === 'LOBBY' && (
            <button onClick={() => socket.emit('start_game')}
              className="rounded-xl bg-emerald-500 px-6 py-4 font-bold text-lg active:scale-95 transition">
              เริ่มเกม ▶
            </button>
          )}
          {state.status === 'DONE' && <div className="text-2xl font-extrabold text-rose-300">🏁 จบเกม!</div>}
        </div>
      </div>

      {teamIds.length === 0 && (
        <div className="flex-1 flex items-center justify-center text-stone-500 text-xl">
          รอผู้เล่นเข้าร่วม... เปิด Band Rush บนมือถือแล้วใส่รหัส PIN นี้
        </div>
      )}

      <div className="grid gap-5" style={{ gridTemplateColumns: `repeat(${Math.max(1, teamIds.length)}, minmax(0,1fr))` }}>
        {teamIds.map((tid) => {
          const t = state.teams[tid];
          const pct = Math.round((t.score / maxScore) * 100);
          return (
            <div key={tid} className="bg-stone-900/60 rounded-2xl p-5 border border-stone-700">
              <div className="flex justify-between items-baseline mb-2">
                <div className="font-bold text-lg text-stone-200">{tid.replace('team_', 'วง ')}</div>
                <div className="text-amber-300 font-semibold flex items-center gap-1">🪙 {t.coins}</div>
              </div>
              <div className="h-6 rounded-full bg-stone-800 overflow-hidden">
                <div className="h-full bg-gradient-to-r from-amber-400 to-rose-500 transition-all duration-500" style={{ width: pct + '%' }} />
              </div>
              <div className="text-right text-2xl font-extrabold mt-1">{t.score}</div>
              {t.comboCount >= 3 && <div className="text-xs text-fuchsia-300 mt-1">🔥 คอมโบ x{t.comboCount}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// นักเรียนเข้าร่วมห้อง
// ---------------------------------------------------------------------------
function StudentJoin({ socket, onJoined }) {
  const [pin, setPin] = useState('');
  const [name, setName] = useState('');
  const [teamId, setTeamId] = useState('team_1');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const join = () => {
    if (!pin || !name) { setError('กรอกให้ครบก่อนนะ'); return; }
    setBusy(true); setError('');
    socket.emit('join_room', { pin: pin.trim(), name: name.trim(), teamId }, (res) => {
      setBusy(false);
      if (!res || res.error) { setError(res ? res.error : 'เข้าร่วมไม่สำเร็จ'); return; }
      onJoined({ pin: pin.trim(), teamId, name: name.trim(), assignedRoles: res.assignedRoles, type: res.type });
    });
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 gap-4 text-center">
      <div className="text-5xl mb-1">🎫</div>
      <h2 className="display text-2xl font-bold text-sky-300">เข้าร่วมวงดนตรี</h2>
      <input value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g,''))} inputMode="numeric" maxLength={6}
        placeholder="รหัส PIN 6 หลัก" className="w-full max-w-xs text-center text-2xl tracking-widest rounded-xl px-4 py-3 bg-stone-800 border border-stone-600 outline-none focus:border-sky-400" />
      <input value={name} onChange={(e) => setName(e.target.value)} maxLength={16}
        placeholder="ชื่อของเธอ" className="w-full max-w-xs text-center rounded-xl px-4 py-3 bg-stone-800 border border-stone-600 outline-none focus:border-sky-400" />
      <div className="flex gap-2">
        {[1,2,3,4].map((n) => (
          <button key={n} onClick={() => setTeamId('team_' + n)}
            className={`w-14 h-14 rounded-xl font-bold ${teamId === 'team_'+n ? 'bg-sky-500' : 'bg-stone-800 border border-stone-600 text-stone-400'}`}>
            วง {n}
          </button>
        ))}
      </div>
      {error && <div className="text-rose-400 text-sm">{error}</div>}
      <button disabled={busy} onClick={join}
        className="rounded-2xl bg-sky-500 px-8 py-4 font-extrabold text-lg shadow-lg active:scale-95 transition disabled:opacity-50">
        {busy ? 'กำลังเข้าร่วม...' : 'เข้าร่วม ▶'}
      </button>
    </div>
  );
}

// ---------------------------------------------------------------------------
// การ์ดบนโต๊ะ (Draggable + Swipe + Flip)
// ---------------------------------------------------------------------------
function DeskCard({ card, myId, onFlip, onSwipe, onSubmit, onDiscardJunk, frozen }) {
  const ref = useRef(null);
  const dragState = useRef({ dragging: false, startX: 0, startY: 0, curX: 0, curY: 0 });
  const [drag, setDrag] = useState({ dx: 0, dy: 0, active: false });
  const mine = card.owner === myId;

  const onPointerDown = (e) => {
    if (!mine || frozen) return;
    dragState.current = { dragging: true, startX: e.clientX, startY: e.clientY, curX: 0, curY: 0 };
    setDrag({ dx: 0, dy: 0, active: true });
    ref.current.setPointerCapture && ref.current.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!dragState.current.dragging) return;
    const dx = e.clientX - dragState.current.startX;
    const dy = e.clientY - dragState.current.startY;
    dragState.current.curX = dx; dragState.current.curY = dy;
    setDrag({ dx, dy, active: true });
  };
  const onPointerUp = () => {
    if (!dragState.current.dragging) return;
    const { curX, curY } = dragState.current;
    dragState.current.dragging = false;
    const w = window.innerWidth;

    const cardEl = ref.current;
    const rect = cardEl ? cardEl.getBoundingClientRect() : { left: 0, right: w };

    if (card.junk) {
      // การ์ดขยะ: ต้องปัดออกนอกจอเท่านั้น
      if (rect.right + curX < 0 || rect.left + curX > w) { onDiscardJunk(card.cardId); }
      setDrag({ dx: 0, dy: 0, active: false });
      return;
    }

    if (rect.right + curX < 0) { onSwipe(card.cardId, 'left'); setDrag({ dx: 0, dy: 0, active: false }); return; }
    if (rect.left + curX > w) { onSwipe(card.cardId, 'right'); setDrag({ dx: 0, dy: 0, active: false }); return; }

    // ปล่อยไว้บนโต๊ะตามตำแหน่งเดิม (การจับคู่ทำผ่านปุ่มหมวดหมู่ด้านล่างแทนการลากลง drop-zone
    // เพื่อให้กดง่ายบนมือถือจอเล็ก และยังคงกลไก drag ไว้สำหรับ swipe/discard)
    setDrag({ dx: 0, dy: 0, active: false });
  };

  const style = {
    left: card.x + '%',
    top: card.y + '%',
    transform: `translate(${drag.dx}px, ${drag.dy}px) rotate(${drag.dx / 18}deg)`,
    zIndex: drag.active ? 50 : 10,
    touchAction: 'none',
  };

  return (
    <div
      ref={ref}
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onClick={() => mine && !frozen && !card.isFaceUp && onFlip(card.cardId, true)}
      className={`absolute w-20 h-28 rounded-xl shadow-xl select-none flip-anim ${mine ? 'cursor-grab active:cursor-grabbing' : 'opacity-70'} ${drag.active ? '' : 'transition-all duration-300'}`}
      style={style}
    >
      {!card.isFaceUp ? (
        <div className="w-full h-full rounded-xl bg-gradient-to-br from-indigo-700 to-purple-900 border-2 border-indigo-400/40 flex items-center justify-center text-2xl">
          🎵
        </div>
      ) : (
        <div className={`w-full h-full rounded-xl border-2 flex flex-col items-center justify-center gap-1 ${card.junk ? 'bg-stone-700 border-stone-500' : 'bg-stone-100 border-white text-stone-900'}`}>
          <div className="text-3xl">{card.emoji}</div>
          <div className="text-[10px] font-bold text-center px-1">{card.label}</div>
        </div>
      )}
      {mine && <div className="absolute -top-2 -right-2 w-3 h-3 rounded-full bg-emerald-400 pulse-ring" />}
    </div>
  );
}

// ---------------------------------------------------------------------------
// ร้านค้า (Shop popup)
// ---------------------------------------------------------------------------
function ShopModal({ coins, isCoop, teamOptions, myTeamId, onBuy, onClose }) {
  const [pendingItem, setPendingItem] = useState(null);

  const chooseTarget = (itemKey) => {
    const meta = ITEM_META[itemKey];
    if (isCoop || itemKey === 'forte') { onBuy(itemKey, myTeamId); return; }
    setPendingItem(itemKey);
  };

  return (
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[100] px-4" onClick={onClose}>
      <div className="bg-stone-900 border border-stone-700 rounded-2xl p-5 w-full max-w-md" onClick={(e) => e.stopPropagation()}>
        {!pendingItem ? (
          <React.Fragment>
            <div className="flex justify-between items-center mb-4">
              <h3 className="display text-xl font-bold text-amber-300">🛒 ร้านค้า</h3>
              <div className="text-amber-300 font-bold">🪙 {coins}</div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              {Object.entries(ITEM_META).map(([key, meta]) => {
                const affordable = coins >= meta.price;
                return (
                  <button key={key} disabled={!affordable} onClick={() => chooseTarget(key)}
                    className={`rounded-xl p-3 text-left border-2 ${meta.ring} ${affordable ? 'bg-stone-800' : 'bg-stone-800/40 opacity-40'} active:scale-95 transition`}>
                    <div className="text-3xl">{meta.emoji}</div>
                    <div className="font-bold">{meta.name}</div>
                    <div className="text-xs text-stone-400 mb-1">{meta.th}</div>
                    <div className="text-amber-300 font-semibold text-sm">🪙 {meta.price}</div>
                  </button>
                );
              })}
            </div>
            <button onClick={onClose} className="mt-4 w-full py-2 rounded-xl bg-stone-800 text-stone-300">ปิด</button>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <h3 className="display text-lg font-bold text-rose-300 mb-3">ยิงใส่วงไหน?</h3>
            <div className="grid grid-cols-2 gap-3">
              {teamOptions.filter((t) => t !== myTeamId).map((t) => (
                <button key={t} onClick={() => { onBuy(pendingItem, t); setPendingItem(null); }}
                  className="rounded-xl p-4 bg-rose-700/40 border-2 border-rose-500 font-bold active:scale-95 transition">
                  {t.replace('team_', 'วง ')}
                </button>
              ))}
            </div>
            <button onClick={() => setPendingItem(null)} className="mt-4 w-full py-2 rounded-xl bg-stone-800 text-stone-300">ย้อนกลับ</button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// หน้าจอเล่นของนักเรียน (Landscape mobile)
// ---------------------------------------------------------------------------
function StudentGame({ socket, session }) {
  const [team, setTeam] = useState(null);
  const [status, setStatus] = useState('LOBBY');
  const [timer, setTimer] = useState(0);
  const [shopOpen, setShopOpen] = useState(false);
  const [flash, setFlash] = useState(null); // {text, ok}
  const [shakeKey, setShakeKey] = useState(0);
  const [allTeamIds, setAllTeamIds] = useState(['team_1']);
  const prevCoins = useRef(0);

  useEffect(() => {
    const onSync = (d) => {
      setStatus(d.status); setTimer(d.timer_seconds); setTeam(d.team);
    };
    const onMatch = (r) => {
      if (r.isCorrect) { sfx.correct(); setFlash({ text: `+${r.pointsAdded} คะแนน 🎉`, ok: true }); }
      else { sfx.wrong(); setFlash({ text: 'ยังไม่ใช่หมวดนี้นะ 🙈', ok: false }); setShakeKey((k) => k + 1); }
      setTimeout(() => setFlash(null), 1200);
    };
    const onReceive = () => sfx.swipe();
    const onCoin = () => sfx.coin();
    const onSabotage = (d) => { sfx.sabotage(); setFlash({ text: `โดนวง ${d.fromTeamId.replace('team_','')} ยิง ${d.itemType}!`, ok: false }); setTimeout(() => setFlash(null), 1800); };
    const onDash = (d) => setAllTeamIds(Object.keys(d.teams));
    const onOver = () => setStatus('DONE');

    socket.on('sync_state', onSync);
    socket.on('match_result', onMatch);
    socket.on('receive_card', onReceive);
    socket.on('coin_updated', onCoin);
    socket.on('sabotage_hit', onSabotage);
    socket.on('dashboard_update', onDash);
    socket.on('game_over', onOver);
    return () => {
      socket.off('sync_state', onSync);
      socket.off('match_result', onMatch);
      socket.off('receive_card', onReceive);
      socket.off('coin_updated', onCoin);
      socket.off('sabotage_hit', onSabotage);
      socket.off('dashboard_update', onDash);
      socket.off('game_over', onOver);
    };
  }, [socket]);

  const frozen = !!(team && team.active_debuffs || []).find ? (team.active_debuffs || []).some((d) => d.type === 'frozen') : false;
  const myCards = team ? team.cards_on_desk.filter((c) => c.owner === socket.id) : [];
  const roles = team && team.players[socket.id] ? team.players[socket.id].assigned_roles : [];
  const isCoop = session.type === 'COOP';

  const flip = useCallback((id, up) => socket.emit('flip_card', { cardId: id, isFaceUp: up }), [socket]);
  const swipe = useCallback((id, dir) => socket.emit('swipe_card', { cardId: id, direction: dir }), [socket]);
  const discardJunk = useCallback((id) => socket.emit('discard_junk', { cardId: id }), [socket]);
  const submit = useCallback((cardId, role) => socket.emit('submit_match', { cardId, targetRole: role }), [socket]);
  const buy = useCallback((itemType, targetTeamId) => { socket.emit('buy_and_use_item', { itemType, targetTeamId }); setShopOpen(false); }, [socket]);

  const mm = Math.floor(timer / 60), ss = String(timer % 60).padStart(2, '0');
  const faceUpMineWithRole = myCards.find((c) => c.isFaceUp && !c.junk);

  if (status === 'LOBBY') {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-3 px-6 text-center">
        <div className="text-5xl animate-bounce">🎶</div>
        <div className="text-xl font-bold">รอครูเริ่มเกม...</div>
        <div className="text-stone-400">วง {session.teamId.replace('team_','')} • {session.name}</div>
        <div className="text-sm text-stone-500">หมวดของเธอ: {roles.map((r) => CATEGORY_LABELS[r].th).join(', ') || '...'}</div>
        {isCoop && <button onClick={() => socket.emit('start_game')} className="mt-4 rounded-xl bg-emerald-500 px-6 py-3 font-bold">เริ่มเกมเลย ▶</button>}
      </div>
    );
  }
  if (status === 'DONE') {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-2 text-center px-6">
        <div className="text-6xl">🏁</div>
        <div className="display text-3xl font-extrabold text-amber-300">จบเกม!</div>
        <div className="text-xl">คะแนนวง {session.teamId.replace('team_','')}: <b>{team ? team.score : 0}</b></div>
        <div className="text-stone-400">เหรียญคงเหลือ: {team ? team.coins : 0}</div>
      </div>
    );
  }

  return (
    <div className="h-screen w-screen flex flex-col overflow-hidden" key={shakeKey}>
      {/* Top bar */}
      <div className="flex items-center justify-between px-3 py-2 bg-stone-950/80 border-b border-stone-800 shrink-0">
        <div className="flex flex-col">
          <span className="text-[10px] text-stone-500 uppercase tracking-wide">หมวดของฉัน</span>
          <span className="font-bold text-sm">{roles.map((r) => `${CATEGORY_LABELS[r].emoji} ${CATEGORY_LABELS[r].th}`).join(' / ') || '-'}</span>
        </div>
        <div className="display font-extrabold text-lg text-stone-300">{mm}:{ss}</div>
        <div className="flex items-center gap-1 bg-stone-800 rounded-full px-3 py-1">
          <span>🪙</span><span className="font-bold text-amber-300">{team ? team.coins : 0}</span>
        </div>
      </div>

      {/* Desk */}
      <div className={`relative flex-1 desk-bg overflow-hidden ${shakeKey ? '' : ''}`}>
        {frozen && (
          <div className="absolute inset-0 frozen-overlay z-40 flex items-center justify-center">
            <div className="text-4xl">🧊 แช่แข็ง!</div>
          </div>
        )}
        {flash && (
          <div className={`absolute top-2 left-1/2 -translate-x-1/2 z-40 px-4 py-2 rounded-full font-bold shadow-lg ${flash.ok ? 'bg-emerald-500' : 'bg-rose-600'}`}>
            {flash.text}
          </div>
        )}
        {team && team.cards_on_desk.map((c) => (
          <DeskCard key={c.cardId} card={c} myId={socket.id} frozen={frozen}
            onFlip={flip} onSwipe={swipe} onDiscardJunk={discardJunk} onSubmit={submit} />
        ))}
      </div>

      {/* Category submit buttons (สำหรับการ์ดหงายที่เป็นของฉัน) */}
      <div className="shrink-0 bg-stone-950/90 border-t border-stone-800 px-3 py-2 flex items-center gap-2 overflow-x-auto">
        {faceUpMineWithRole ? (
          Object.entries(CATEGORY_LABELS).map(([key, meta]) => (
            <button key={key} onClick={() => submit(faceUpMineWithRole.cardId, key)}
              className={`shrink-0 rounded-xl px-3 py-2 text-xs font-bold bg-gradient-to-br ${meta.color} active:scale-95 transition`}>
              {meta.emoji} {meta.th}
            </button>
          ))
        ) : (
          <div className="text-xs text-stone-500 px-1">แตะการ์ดของเธอเพื่อเปิด แล้วเลือกหมวดที่ถูกต้อง หรือลากออกขอบจอเพื่อส่งให้เพื่อน</div>
        )}
        <button onClick={() => setShopOpen(true)} className="ml-auto shrink-0 w-12 h-12 rounded-full bg-amber-400 text-stone-900 text-xl flex items-center justify-center shadow-lg active:scale-95 transition">
          🛒
        </button>
      </div>

      {shopOpen && team && (
        <ShopModal coins={team.coins} isCoop={isCoop} teamOptions={allTeamIds} myTeamId={session.teamId}
          onBuy={buy} onClose={() => setShopOpen(false)} />
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Root App — routing แบบง่าย ไม่ใช้ library ภายนอก
// ---------------------------------------------------------------------------
function App() {
  const socket = useSocket();
  const [screen, setScreen] = useState('home'); // home | teacher-create | teacher-dash | student-join | student-game
  const [pin, setPin] = useState(null);
  const [session, setSession] = useState(null);

  if (screen === 'home') return <Home onPickRole={(r) => setScreen(r === 'teacher' ? 'teacher-create' : 'student-join')} />;
  if (screen === 'teacher-create') return <TeacherCreate socket={socket} onRoomReady={(p) => { setPin(p); setScreen('teacher-dash'); }} />;
  if (screen === 'teacher-dash') return <TeacherDashboard socket={socket} pin={pin} />;
  if (screen === 'student-join') return <StudentJoin socket={socket} onJoined={(s) => { setSession(s); setScreen('student-game'); }} />;
  if (screen === 'student-game') return <StudentGame socket={socket} session={session} />;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
